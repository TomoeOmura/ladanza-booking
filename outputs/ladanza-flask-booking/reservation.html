<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La Danza｜予約内容の確認</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+JP:wght@500;600&display=swap');
:root{--green:#173f35;--mint:#e6f0eb;--ivory:#fbfaf6;--gold:#b79b62;--line:#dde2de}*{box-sizing:border-box}body{margin:0;background:#f2f4f1;color:var(--green);font-family:'DM Sans',sans-serif}.shell{max-width:620px;min-height:100vh;margin:auto;padding:28px 18px 50px;background:var(--ivory)}.brand{font:600 22px 'Noto Serif JP';letter-spacing:.05em}.brand small{display:block;font:500 9px 'DM Sans';letter-spacing:.22em;color:#71837d}.eyebrow{margin-top:42px;color:var(--gold);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}h1{font:600 27px/1.45 'Noto Serif JP';margin:8px 0 22px}.number{display:inline-block;padding:7px 12px;border-radius:20px;background:var(--mint);font-weight:600}.card{margin:16px 0;padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 8px 25px #173f3509}.row{display:grid;grid-template-columns:90px 1fr;gap:13px;padding:12px 0;border-bottom:1px solid #edf0ed}.row:last-child{border:0}.row span{font-size:11px;color:#788780}.row strong{font-size:14px}.notice{font-size:12px;line-height:1.8;color:#64756f}.cancel{width:100%;margin-top:18px;padding:15px;border:1px solid #b9c3bf;border-radius:13px;background:transparent;color:var(--green);font-weight:600}.cancel:disabled{opacity:.45}.status{padding:12px;border-radius:12px;text-align:center;background:#f3e7e3;color:#8b4337;font-weight:600}.hidden{display:none!important}
</style></head><body><main class="shell"><div class="brand">La Danza<small>DANCE STUDIO</small></div><section id="loading"><p class="eyebrow">Reservation</p><h1>予約内容を確認しています</h1></section><section id="content" class="hidden"><p class="eyebrow">Reservation details</p><h1>ご予約内容</h1><div id="number" class="number"></div><div id="status" class="status hidden"></div><div class="card"><div class="row"><span>メニュー</span><strong id="menu"></strong></div><div class="row"><span>日時</span><strong id="datetime"></strong></div><div class="row"><span>講師</span><strong id="instructor"></strong></div></div><div class="card notice"><strong>ご来店前のご案内</strong><br>開始10分前を目安にお越しください。動きやすい服装と室内用シューズをご用意ください。前日・当日のキャンセルも、下のボタンからお手続きいただけます。</div><button id="cancel" class="cancel">この予約をキャンセルする</button></section><section id="error" class="hidden"><p class="eyebrow">Reservation</p><h1>予約を確認できませんでした</h1><p>リンクが正しいか、もう一度お確かめください。</p></section></main>
<script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);let data,token=params.get('token')||location.pathname.split('/').filter(Boolean).pop();
const format=s=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(s));
function render(){ $('#loading').classList.add('hidden');$('#content').classList.remove('hidden');$('#number').textContent='予約番号: '+data.reservation_number;$('#menu').textContent=data.menu;$('#datetime').textContent=format(data.starts_at);$('#instructor').textContent=data.instructor;if(data.status==='cancelled')cancelled() }
function cancelled(){data.status='cancelled';$('#status').textContent='この予約はキャンセル済みです';$('#status').classList.remove('hidden');$('#cancel').disabled=true;$('#cancel').textContent='キャンセル済み'}
async function load(){try{if(params.get('demo')){data={reservation_number:params.get('number'),menu:params.get('menu'),instructor:params.get('instructor'),starts_at:params.get('starts_at'),status:'confirmed'};render();return}let r=await fetch('/api/reservations/'+token);if(!r.ok)throw 0;data=await r.json();render()}catch{$('#loading').classList.add('hidden');$('#error').classList.remove('hidden')}}
$('#cancel').onclick=async()=>{if(!confirm('この予約をキャンセルしますか？\n取り消し後は元に戻せません。'))return;if(params.get('demo')){cancelled();return}$('#cancel').disabled=true;$('#cancel').textContent='処理しています…';let r=await fetch('/api/reservations/'+token+'/cancel',{method:'POST'});if(r.ok)cancelled();else{$('#cancel').disabled=false;$('#cancel').textContent='この予約をキャンセルする';alert('処理できませんでした。時間をおいてお試しください')}};load();
</script></body></html>
