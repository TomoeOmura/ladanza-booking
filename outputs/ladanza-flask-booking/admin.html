<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Danza｜講師別予約枠</title><style>
:root{--g:#173f35;--bg:#f3f5f2;--line:#dce3df;--mint:#e2eee8;--muted:#71817b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--g);font-family:system-ui,sans-serif}header{padding:22px 18px;background:var(--g);color:#fff}.wrap,main{max-width:980px;margin:auto}.brand{font-family:serif;font-size:22px}.brand small{display:block;font:9px sans-serif;letter-spacing:.2em;opacity:.6}main{padding:20px 16px 70px}.login,.panel{padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 7px 25px #173f3508}.login{display:flex;gap:9px;max-width:520px;margin:35px auto}.login input,input{width:100%;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}h1{font-family:serif;font-size:27px;margin:10px 0 4px}.lead{margin:0 0 20px;color:var(--muted);font-size:13px}.panel{margin:14px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.head h2{font-size:16px;margin:0}.teachers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 16px}.teacher-tab{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border:2px solid transparent;color:#345;background:#f5f6f5}.teacher-tab i{width:12px;height:12px;border-radius:50%}.teacher-tab.active{border-color:var(--teacher);background:var(--teacher-bg);color:var(--g);box-shadow:0 5px 16px #173f3512}.t0{--teacher:#789bc8;--teacher-bg:#e5eefb}.t0 i{background:#789bc8}.t1{--teacher:#c9809c;--teacher-bg:#f8e8ef}.t1 i{background:#c9809c}.t2{--teacher:#6fa58e;--teacher-bg:#dff1e9}.t2 i{background:#6fa58e}.t3{--teacher:#b79b62;--teacher-bg:#f4eddd}.t3 i{background:#b79b62}.quick{display:flex;gap:6px}.quick button,.bulk{background:var(--mint);color:var(--g);font-size:10px;padding:7px 9px}.schedule{overflow:auto;border:1px solid var(--line);border-radius:12px}.schedule table{min-width:860px;width:100%;border-collapse:separate;border-spacing:0}.schedule th,.schedule td{padding:6px 4px;text-align:center;border-right:1px solid #edf0ed;border-bottom:1px solid #edf0ed}.schedule th{position:sticky;top:0;background:#f7f9f7;color:var(--muted);font-size:10px}.schedule th:first-child,.schedule td:first-child{position:sticky;left:0;min-width:110px;background:#fff;z-index:2}.day{font-weight:700;font-size:13px}.bulk{display:block;margin:4px auto 0;padding:4px 7px}.slot{appearance:none;width:31px;height:31px;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;background:#f7f8f7}.slot:checked{background:var(--active-bg,#e2eee8);border-color:var(--active,#8aafa0)}.slot:checked:after{content:'✓';display:grid;height:100%;place-items:center;color:var(--active,#28634f);font-weight:700}.menu{display:grid;grid-template-columns:1fr 100px 85px;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0ed}.menu strong{font-size:13px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.save{position:sticky;bottom:12px;width:100%;padding:15px;box-shadow:0 8px 22px #173f3535}.notice{padding:11px;border-radius:10px;background:#fff8dd;color:#765c14;font-size:12px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:11px 17px;border-radius:99px;background:var(--g);color:#fff}@media(max-width:680px){.teachers{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.menu{grid-template-columns:1fr 80px}.capacity{display:none}}
</style></head><body><header><div class="wrap"><div class="brand">La Danza<small>INSTRUCTOR SCHEDULE SETTINGS</small></div></div></header><main><div id="login" class="login"><input id="password" type="password" autocomplete="current-password" placeholder="管理パスワード"><button id="loginBtn">表示</button></div><section id="app" class="hidden"><h1>講師別レッスン予約枠</h1><p class="lead">先生を選び、チェックした時間だけ予約可能にします。設定は毎週繰り返されます。</p><form id="settings"><div class="panel"><div class="head"><h2>講師を選択</h2></div><div id="teachers" class="teachers"></div><div class="head"><h2><span id="selectedName"></span> の曜日・時間</h2><div class="quick"><button type="button" onclick="setAll(true)">全選択</button><button type="button" onclick="setAll(false)">全解除</button></div></div><div id="schedule" class="schedule"></div></div><div class="panel"><div class="head"><h2>メニュー別レッスン時間</h2></div><div id="menus"></div></div><button class="save">全講師の週間設定を保存する</button></form></section></main><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s),days=['月','火','水','木','金','土','日'],instructors=['大村 尊','大村 友恵','廣瀬 裕貴','スタジオ主催'];
const colors=[['#789bc8','#e5eefb'],['#c9809c','#f8e8ef'],['#6fa58e','#dff1e9'],['#b79b62','#f4eddd']];
const times=Array.from({length:24},(_,i)=>`${String(10+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`);
const defaultMenus={'個人レッスン 60分':{duration:60,capacity:1},'個人レッスン 30分':{duration:30,capacity:1},'無料体験 20分':{duration:20,capacity:1},'初心者パック 30分':{duration:30,capacity:1},'初級パック30分':{duration:30,capacity:1},'サロン・グループ':{duration:30,capacity:15}};
const weeklyDefault=()=>Object.fromEntries(days.map((_,d)=>[d,d===6?[]:[...times]]));
const defaultConfig=()=>({instructor_slots:Object.fromEntries(instructors.map(n=>[n,weeklyDefault()])),date_overrides:Object.fromEntries(instructors.map(n=>[n,{}])),menus:JSON.parse(JSON.stringify(defaultMenus))});
let token='',config,activeInstructor=instructors[0],viewMode='weekly',selectedDate=new Date().toISOString().slice(0,10),dateDirty=false;const headers=()=>({'Content-Type':'application/json','X-Admin-Token':token});
function normalize(c){if(!c.instructor_slots){let weekly=c.weekly_slots||weeklyDefault();c.instructor_slots=Object.fromEntries(instructors.map(n=>[n,JSON.parse(JSON.stringify(weekly))]))}if(!c.date_overrides)c.date_overrides=Object.fromEntries(instructors.map(n=>[n,{}]));return c}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2000)}
async function login(){token=$('#password').value;if(!token)return alert('管理パスワードを入力してください');try{let r=await fetch('/api/admin/settings',{headers:headers()});if(!r.ok)return alert('パスワードが正しくありません');config=normalize(await r.json());open()}catch{return alert('管理画面へ接続できません。時間をおいて再度お試しください')}}
function open(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');renderTabs();ensureDateControls();renderSchedule();renderMenus()}
function ensureDateControls(){let panel=$('#teachers').parentElement,box=document.createElement('div');box.id='dateControls';box.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px;padding:12px;border-radius:12px;background:#f5f7f5';box.innerHTML=`<button type="button" id="weeklyBtn" onclick="switchMode('weekly')">毎週の曜日設定</button><button type="button" id="dateBtn" onclick="switchMode('date')">日付を指定</button><input id="specificDate" type="date" value="${selectedDate}" onchange="changeDate(this.value)" style="max-width:170px"><button type="button" onclick="copyWeekly()" class="date-action">曜日設定をコピー</button><button type="button" onclick="dayOff()" class="date-action">この日を休み</button><button type="button" onclick="clearOverride()" class="date-action">個別設定を解除</button><span id="overrideState" style="font-size:11px;color:#71817b"></span>`;panel.insertBefore(box,$('#selectedName').closest('.head'));updateModeControls()}
function updateModeControls(){if(!$('#dateControls'))return;document.querySelectorAll('.date-action,#specificDate').forEach(x=>x.style.display=viewMode==='date'?'':'none');$('#weeklyBtn').style.opacity=viewMode==='weekly'?'1':'.55';$('#dateBtn').style.opacity=viewMode==='date'?'1':'.55'}
function switchMode(mode){storeVisible();viewMode=mode;updateModeControls();renderSchedule()}function changeDate(value){storeVisible();selectedDate=value;renderSchedule()}
function copyWeekly(){let d=(new Date(selectedDate+'T00:00:00').getDay()+6)%7;config.date_overrides[activeInstructor][selectedDate]=[...(config.instructor_slots[activeInstructor][d]||[])];renderSchedule()}
function dayOff(){config.date_overrides[activeInstructor][selectedDate]=[];renderSchedule()}
function clearOverride(){delete config.date_overrides[activeInstructor][selectedDate];renderSchedule()}
function renderTabs(){$('#teachers').innerHTML=instructors.map((n,i)=>`<button type="button" class="teacher-tab t${i} ${n===activeInstructor?'active':''}" onclick="selectInstructor('${n}')"><i></i>${n}</button>`).join('')}
function selectInstructor(name){storeVisible();activeInstructor=name;renderTabs();renderSchedule()}
function renderSchedule(){let idx=instructors.indexOf(activeInstructor),c=colors[idx];dateDirty=false;$('#selectedName').textContent=activeInstructor+(viewMode==='date'?`・${selectedDate}`:'');$('#schedule').style.setProperty('--active',c[0]);$('#schedule').style.setProperty('--active-bg',c[1]);let table=`<table><thead><tr><th>${viewMode==='weekly'?'曜日':'日付'}</th>${times.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>`;if(viewMode==='weekly'){let weekly=config.instructor_slots[activeInstructor];table+=days.map((day,d)=>`<tr><td><span class="day">${day}曜日</span><button class="bulk" type="button" onclick="toggleDay(${d})">一括 選択/解除</button></td>${times.map(t=>`<td><input class="slot" type="checkbox" data-day="${d}" value="${t}" ${(weekly?.[d]||[]).includes(t)?'checked':''}></td>`).join('')}</tr>`).join('')}else{let dateObj=new Date(selectedDate+'T00:00:00'),d=(dateObj.getDay()+6)%7,own=Object.hasOwn(config.date_overrides[activeInstructor],selectedDate),values=own?config.date_overrides[activeInstructor][selectedDate]:(config.instructor_slots[activeInstructor][d]||[]);table+=`<tr><td><span class="day">${selectedDate}<br>${days[d]}曜日</span><button class="bulk" type="button" onclick="toggleDay(0)">一括 選択/解除</button></td>${times.map(t=>`<td><input class="slot" type="checkbox" data-day="0" value="${t}" ${values.includes(t)?'checked':''}></td>`).join('')}</tr>`;$('#overrideState').textContent=own?'この日は個別設定です':'曜日設定を使用中'}$('#schedule').innerHTML=table;$('#schedule').onchange=()=>{if(viewMode==='date')dateDirty=true}}
function renderMenus(){$('#menus').innerHTML=Object.entries(config.menus).map(([name,v])=>`<div class="menu" data-name="${name}"><strong>${name}</strong><div class="field"><label>所要時間</label><input class="duration" type="number" min="15" max="180" step="5" value="${v.duration}"></div><div class="field capacity"><label>定員</label><input class="cap" type="number" min="1" max="15" value="${v.capacity}"></div></div>`).join('')}
function storeVisible(){if(!$('#schedule').innerHTML)return;if(viewMode==='weekly'){let weekly={};for(let d=0;d<7;d++)weekly[d]=[...document.querySelectorAll(`.slot[data-day="${d}"]:checked`)].map(x=>x.value);config.instructor_slots[activeInstructor]=weekly}else if(dateDirty||Object.hasOwn(config.date_overrides[activeInstructor],selectedDate)){config.date_overrides[activeInstructor][selectedDate]=[...document.querySelectorAll('.slot:checked')].map(x=>x.value)}}
function toggleDay(day){let boxes=[...document.querySelectorAll(`.slot[data-day="${day}"]`)],on=boxes.some(x=>!x.checked);boxes.forEach(x=>x.checked=on);if(viewMode==='date')dateDirty=true}function setAll(on){document.querySelectorAll('.slot').forEach(x=>x.checked=on);if(viewMode==='date')dateDirty=true}
function collect(){storeVisible();let menus={};document.querySelectorAll('.menu').forEach(row=>menus[row.dataset.name]={duration:+row.querySelector('.duration').value,capacity:+row.querySelector('.cap').value});return{instructor_slots:config.instructor_slots,date_overrides:config.date_overrides,menus}}
$('#settings').onsubmit=async e=>{e.preventDefault();let body=collect();try{let r=await fetch('/api/admin/settings',{method:'PUT',headers:headers(),body:JSON.stringify(body)}),j=await r.json();if(!r.ok)return alert(j.detail||'保存できませんでした');config=normalize(j);toast('全講師の設定を保存しました')}catch{alert('設定を保存できませんでした。通信状況を確認してください')}};$('#loginBtn').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
