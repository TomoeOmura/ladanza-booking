<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La Danza｜ご予約</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+JP:wght@500;600&display=swap');
:root{--ink:#153b32;--green:#205b49;--mint:#dfece6;--ivory:#fbfaf6;--gold:#b79b62;--line:#dedfd9}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:'DM Sans',sans-serif}.shell{max-width:760px;margin:auto;min-height:100vh;padding:24px 18px 118px;background:radial-gradient(circle at 90% 0,#e7f0eb 0,transparent 32%)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{font:600 23px 'Noto Serif JP';letter-spacing:.05em}.brand small{display:block;font:500 9px 'DM Sans';letter-spacing:.24em;color:#648078}.step{font-size:11px;letter-spacing:.12em;color:#71847e}.progress{height:2px;background:#e0e4df;margin:0 0 31px}.progress i{display:block;height:100%;width:33%;background:var(--green);transition:.3s}.eyebrow{color:var(--gold);font-size:10px;font-weight:600;letter-spacing:.17em;text-transform:uppercase}.panel h1{font:600 27px/1.5 'Noto Serif JP';margin:8px 0 7px}.lead{margin:0 0 22px;color:#65756f;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;text-align:left;color:var(--ink);min-height:91px;cursor:pointer;transition:.2s;box-shadow:0 5px 20px #254b3b0a}.card strong{display:block;font-size:14px}.card small{display:block;margin-top:7px;color:#72817c}.card.active{border:1.5px solid var(--green);background:#f2f7f4;box-shadow:inset 0 0 0 1px var(--green)}.teachers{display:flex;gap:9px;overflow:auto;padding:2px 0 6px}.teacher{min-width:125px;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--mint);font:600 14px 'Noto Serif JP'}.dates{display:flex;gap:8px;overflow:auto;padding:2px 0 15px}.date{min-width:67px;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:30px;background:#fff;color:var(--ink)}.date b{display:block;font-size:18px}.date.active,.time.active{background:var(--green);color:white;border-color:var(--green)}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.time{padding:12px 5px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}.time:disabled{opacity:.4}.badge{display:block;font-size:9px;margin-top:4px;color:#52776b}.active .badge{color:#dcebe5}.field{margin:12px 0}.field label{display:block;font-size:11px;margin:0 0 7px}.field input{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.bottom{position:fixed;left:0;right:0;bottom:0;padding:13px 18px calc(13px + env(safe-area-inset-bottom));background:#fbfaf6eF;backdrop-filter:blur(12px);border-top:1px solid #e5e4df}.bottom-inner{max-width:724px;margin:auto;display:flex;gap:10px}.next{flex:1;border:0;border-radius:14px;padding:16px;background:var(--green);color:white;font-weight:600;font-size:15px}.next:disabled{background:#aab6b1}.back{border:1px solid var(--line);border-radius:14px;padding:0 17px;background:white;color:var(--ink)}.hidden{display:none!important}.summary{padding:15px;border-radius:14px;background:var(--mint);font-size:13px;margin:15px 0}.success{text-align:center;padding:60px 10px}.success .check{width:64px;height:64px;border-radius:50%;margin:auto;background:var(--green);color:#fff;display:grid;place-items:center;font-size:27px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.shell{padding-top:36px}.panel h1{font-size:32px}}
.avatar-instructor-0{background:#E5EEFB;color:#3567A8;border:1px solid #CEDDF2;box-shadow:0 3px 10px #3567A812}.avatar-instructor-1{background:#F8E8EF;color:#B45B7D;border:1px solid #EFD3DF;box-shadow:0 3px 10px #B45B7D12}.avatar-instructor-2{background:#DFF1E9;color:#3F8068;border:1px solid #C9E5D9;box-shadow:0 3px 10px #3F806812}.teacher.active .avatar{transform:scale(1.04)}
</style></head><body><main class="shell"><header><div class="brand">La Danza<small>DANCE STUDIO</small></div><div class="step">STEP <span id="stepNo">01</span> / 03</div></header><div class="progress"><i id="bar"></i></div>
<section id="s1" class="panel"><span class="eyebrow">Choose your lesson</span><h1>ご希望のレッスンと講師を<br>お選びください</h1><p class="lead">メニューと講師をお選びください</p><div id="menus" class="grid"></div><div id="instructorArea"><p class="eyebrow" style="margin-top:24px">Instructor</p><div id="teachers" class="teachers"></div></div></section>
<section id="s2" class="panel hidden"><span class="eyebrow">Date & time</span><h1>ご希望の日時を<br>お選びください</h1><p class="lead">ご予約可能な時間のみ表示しています</p><div id="dates" class="dates"></div><div id="times" class="times"></div></section>
<section id="s3" class="panel hidden"><span class="eyebrow">Your details</span><h1>ご連絡先を<br>お知らせください</h1><div id="summary" class="summary"></div><form id="form"><div class="field"><label>お名前</label><input name="name" autocomplete="name" required placeholder="山田 花子"></div><div class="field"><label>電話番号</label><input name="phone" type="tel" autocomplete="tel" required placeholder="090-1234-5678"></div><div class="field"><label>メールアドレス</label><input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div></form></section>
<section id="success" class="success hidden"><div class="check">✓</div><h1>ご予約が完了しました</h1><p id="reservationNo" style="font-weight:600"></p><p id="doneText" class="lead"></p><a id="cancelLink" class="next" style="display:block;text-decoration:none">予約内容を確認・キャンセルする</a></section></main>
<div id="bottom" class="bottom"><div class="bottom-inner"><button id="back" class="back hidden">戻る</button><button id="next" class="next" disabled>日時を選ぶ</button></div></div>
<script>
const menus=['個人レッスン 60分','個人レッスン 30分','無料体験 20分','初心者パック 30分','初級パック30分','サロン・グループ'], teachers=['大村 尊','大村 友恵','廣瀬 裕貴'];let state={step:1,menu:null,teacher:null,slot:null,slots:[]};
const $=s=>document.querySelector(s); const fmt=d=>new Intl.DateTimeFormat('ja-JP',{month:'short',day:'numeric',weekday:'short'}).format(d);
$('#menus').innerHTML=menus.map((m,i)=>`<button class="card" data-menu="${m}"><strong>${m}</strong><small>${m.includes('グループ')?'最大15名・残席表示':'マンツーマン'}</small></button>`).join('');
$('#teachers').innerHTML=teachers.map((t,i)=>`<button class="teacher" data-teacher="${t}"><span class="avatar avatar-instructor-${i}">${t[0]}</span><strong>${t}</strong></button>`).join('');
document.addEventListener('click',e=>{let b=e.target.closest('[data-menu],[data-teacher],[data-slot],[data-date]');if(!b)return;if(b.dataset.menu){chooseMenu(b.dataset.menu);select('[data-menu]',b)}if(b.dataset.teacher){state.teacher=b.dataset.teacher;select('[data-teacher]',b)}if(b.dataset.date){renderTimes(b.dataset.date);select('[data-date]',b)}if(b.dataset.slot){state.slot=state.slots.find(x=>x.id==b.dataset.slot);select('[data-slot]',b)}update()});
function chooseMenu(menu){const wasGroup=state.menu==='サロン・グループ';state.menu=menu;state.slot=null;if(menu==='サロン・グループ'){state.teacher='スタジオ主催';$('#instructorArea').classList.add('hidden');document.querySelectorAll('[data-teacher]').forEach(x=>x.classList.remove('active'))}else{$('#instructorArea').classList.remove('hidden');if(wasGroup)state.teacher=null}}
function select(q,b){document.querySelectorAll(q).forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function update(){if(state.step===1)$('#next').disabled=!(state.menu&&state.teacher);if(state.step===2)$('#next').disabled=!state.slot}
function demoSlots(isGroup){let slots=[],id=9000;for(let day=0;day<14;day++){let date=new Date();date.setDate(date.getDate()+day);let y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0'),ymd=`${y}-${m}-${d}`;for(let minutes=10*60;minutes<=20*60;minutes+=30){let hour=Math.floor(minutes/60),minute=minutes%60,capacity=isGroup?15:1,booked=isGroup?(day+hour+minute)%8:0;slots.push({id:id++,instructor:isGroup?'スタジオ主催':state.teacher,starts_at:`${ymd}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00`,duration_minutes:30,capacity,booked,remaining:capacity-booked,available:true,demo:true})}}return slots}
async function loadSlots(){const isGroup=state.menu==='サロン・グループ',query=isGroup?'':'?instructor='+encodeURIComponent(state.teacher);try{if(location.protocol==='file:')throw new Error('demo');let r=await fetch('/api/slots'+query);if(!r.ok)throw new Error('api');state.slots=(await r.json()).filter(s=>isGroup?s.capacity>1:s.capacity===1)}catch(e){state.slots=demoSlots(isGroup)}let days=[...new Set(state.slots.map(s=>s.starts_at.slice(0,10)))];$('#dates').innerHTML=days.length?days.map((d,i)=>`<button class="date ${i?'':'active'}" data-date="${d}"><small>${fmt(new Date(d)).split(' ')[1]||''}</small><b>${new Date(d).getDate()}</b></button>`).join(''):'<p>現在ご予約可能な枠はありません。</p>';if(days[0])renderTimes(days[0])}
function renderTimes(day){let list=state.slots.filter(s=>s.starts_at.startsWith(day));$('#times').innerHTML=list.map(s=>`<button class="time" data-slot="${s.id}" ${s.available?'':'disabled'}>${s.starts_at.slice(11,16)}〜<span class="badge">${s.available?(s.capacity>1?'残り'+s.remaining+'名':'予約可能'):'満員・受付終了'}</span></button>`).join('')}
function go(n){state.step=n;['s1','s2','s3'].forEach((id,i)=>$('#'+id).classList.toggle('hidden',i!==n-1));$('#stepNo').textContent='0'+n;$('#bar').style.width=(n/3*100)+'%';$('#back').classList.toggle('hidden',n===1);$('#next').textContent=n===1?'日時を選ぶ':n===2?'お客様情報へ':'予約を確定する';$('#next').disabled=n===2?!state.slot:false;if(n===2)loadSlots();if(n===3)$('#summary').textContent=`${state.menu}｜${state.teacher}｜${fmt(new Date(state.slot.starts_at))} ${state.slot.starts_at.slice(11,16)}`}
$('#next').onclick=async()=>{if(state.step<3)return go(state.step+1);if(!$('#form').reportValidity())return;$('#next').disabled=true;$('#next').textContent='予約しています…';let data=Object.fromEntries(new FormData($('#form')));data.slot_id=state.slot.id;data.menu=state.menu;let j;if(state.slot.demo){let no='#10023',q=new URLSearchParams({demo:'1',number:no,menu:state.menu,instructor:state.teacher,starts_at:state.slot.starts_at});j={reservation_number:no,reservation_url:'reservation.html?'+q,starts_at:state.slot.starts_at}}else{let r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});j=await r.json();if(!r.ok){alert(j.detail||'予約できませんでした');$('#next').disabled=false;$('#next').textContent='予約を確定する';return}}$('#s3').classList.add('hidden');$('#success').classList.remove('hidden');$('#bottom').classList.add('hidden');$('#reservationNo').textContent='予約番号: '+j.reservation_number;$('#doneText').textContent=`${fmt(new Date(j.starts_at))} ${j.starts_at.slice(11,16)} にお待ちしています。`;$('#cancelLink').href=j.reservation_url};$('#back').onclick=()=>go(state.step-1);
</script></body></html>
